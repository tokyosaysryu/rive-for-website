<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Interactive Text Room</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
    rel="stylesheet"
  >


  <style>

    :root {

      --bg: #080808;

      --white: #ffffff;

      --orange: #ff5a00;


      --room-w:
        clamp(900px, 125vw, 1600px);

      --room-h:
        clamp(600px, 82vw, 980px);

      --depth:
        clamp(650px, 85vw, 1000px);

    }


    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: var(--bg);

    }


    body {

      font-family:
        "Bebas Neue",
        sans-serif;

    }


    /* ============================
       VIEWPORT
    ============================ */

    .scene {

      position: relative;

      width: 100vw;
      height: 100vh;

      min-height: 520px;

      overflow: hidden;


      /*
        Strong wide-angle feel.
      */

      perspective: 390px;

      perspective-origin:
        50% 50%;


      background:
        var(--bg);


      cursor:
        crosshair;

    }


    /* ============================
       ROOM
    ============================ */

    .room {

      position: absolute;

      left: 50%;
      top: 50%;


      width:
        var(--room-w);

      height:
        var(--room-h);


      transform-style:
        preserve-3d;


      transform:

        translate3d(
          -50%,
          -50%,
          100px
        )

        rotateX(0deg)

        rotateY(0deg);


      will-change:
        transform;


      pointer-events:
        none;

    }


    /* ============================
       FACES
    ============================ */

    .face {

      position: absolute;

      overflow: hidden;

      background:
        var(--bg);

      color:
        var(--white);


      transform-style:
        preserve-3d;


      backface-visibility:
        visible;

    }


    /* FRONT WALL */

    .back {

      inset: 0;

      transform:

        translateZ(
          calc(
            var(--depth) * -1
          )
        );

    }


    /* FLOOR */

    .floor {

      left: 0;
      top: 100%;

      width: 100%;

      height:
        var(--depth);


      transform-origin:
        0 0;


      transform:

        translateZ(
          calc(
            var(--depth) * -1
          )
        )

        rotateX(90deg);

    }


    /* CEILING */

    .ceiling {

      left: 0;
      bottom: 100%;

      width: 100%;

      height:
        var(--depth);


      transform-origin:
        0 100%;


      transform:

        translateZ(
          calc(
            var(--depth) * -1
          )
        )

        rotateX(-90deg);

    }


    /* LEFT WALL */

    .left {

      right: 100%;
      top: 0;

      width:
        var(--depth);

      height:
        100%;


      transform-origin:
        100% 0;


      transform:

        translateZ(
          calc(
            var(--depth) * -1
          )
        )

        rotateY(90deg);

    }


    /* RIGHT WALL */

    .right {

      left: 100%;
      top: 0;

      width:
        var(--depth);

      height:
        100%;


      transform-origin:
        0 0;


      transform:

        translateZ(
          calc(
            var(--depth) * -1
          )
        )

        rotateY(-90deg);

    }


    /* ============================
       FOUR WORDS PER FACE
    ============================ */

    .surface {

      width: 100%;
      height: 100%;

      display: grid;

      grid-template-rows:
        repeat(4, 1fr);

      overflow: hidden;

      background:
        var(--bg);

    }


    .text-row {

      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      overflow: visible;

      white-space: nowrap;


      font-family:
        "Bebas Neue",
        sans-serif;


      /*
        Bebas Neue is actually 400.
        Stroke makes it visually much heavier.
      */

      font-weight: 400;

      font-size: 120px;

      line-height: 0.76;

      letter-spacing: -0.055em;

    }


    .word-token {

      display: inline-flex;

      flex: 0 0 auto;

      transform-origin:
        center center;

      white-space: nowrap;

      will-change:
        transform;

    }


    /* ============================
       LETTER
    ============================ */

    .glyph {

      position: relative;

      display: grid;

      place-items: center;


      /*
        Tight character widths.
      */

      width: 0.455em;

      height: 0.84em;

    }


    .glyph-layer {

      grid-area:
        1 / 1;


      display: block;


      font-family:
        "Bebas Neue",
        sans-serif;


      font-weight: 400;


      line-height: 0.76;


      /*
        Fake heavier Bebas.
      */

      -webkit-text-stroke:
        1.35px currentColor;


      paint-order:
        stroke fill;


      will-change:
        opacity;

    }


    /* ============================
       ORANGE TRAIL

       IMPORTANT:
       Exact same position as white.

       When both show the same letter,
       orange is completely hidden.

       During the transition, orange
       temporarily shows the previous
       character behind the new white one.
    ============================ */

    .trail {

      color:
        var(--orange);


      z-index:
        1;


      opacity:
        1;

    }


    /* WHITE FRONT LETTER */

    .front {

      color:
        var(--white);


      position:
        relative;


      z-index:
        2;

    }


    /* ============================
       VIGNETTE
    ============================ */

    .vignette {

      position: absolute;

      inset: 0;

      z-index: 10;

      pointer-events: none;


      background:

        radial-gradient(

          circle at center,

          transparent 28%,

          rgba(
            0,
            0,
            0,
            0.08
          )
          58%,

          rgba(
            0,
            0,
            0,
            0.58
          )
          100%

        );

    }


    /* ============================
       MOBILE
    ============================ */

    @media
      (max-width: 700px) {

      :root {

        --room-w:
          950px;

        --room-h:
          620px;

        --depth:
          720px;

      }


      .scene {

        perspective:
          340px;

      }

    }


  </style>

</head>



<body>


  <main
    class="scene"
    id="scene"
  >


    <div
      class="room"
      id="room"
    >


      <!-- FRONT WALL -->

      <section
        class="face back"
      >

        <div
          class="surface"
          data-face="0"
        ></div>

      </section>


      <!-- FLOOR -->

      <section
        class="face floor"
      >

        <div
          class="surface"
          data-face="1"
        ></div>

      </section>


      <!-- CEILING -->

      <section
        class="face ceiling"
      >

        <div
          class="surface"
          data-face="2"
        ></div>

      </section>


      <!-- LEFT WALL -->

      <section
        class="face left"
      >

        <div
          class="surface"
          data-face="3"
        ></div>

      </section>


      <!-- RIGHT WALL -->

      <section
        class="face right"
      >

        <div
          class="surface"
          data-face="4"
        ></div>

      </section>


    </div>


    <div
      class="vignette"
    ></div>


  </main>



  <script>


    /* ============================
       WORDS
    ============================ */

    const words = [

      "CREATE",

      "MOTION",

      "DESIGN",

      "EXPLORE",

      "IMAGINE",

      "SYSTEMS"

    ];


    const scene =
      document.getElementById(
        "scene"
      );


    const room =
      document.getElementById(
        "room"
      );


    const surfaces = [

      ...document.querySelectorAll(
        ".surface"
      )

    ];


    const maxLetters =

      Math.max(

        ...words.map(
          word =>
            word.length
        )

      );


    const glyphs = [];



    /* ============================
       CHARACTER HELPER
    ============================ */

    function setCharacter(
      element,
      character
    ) {

      element.textContent =

        character ||

        "\u00A0";

    }



    /* ============================
       CREATE LETTER
    ============================ */

    function createGlyph(

      character,

      letterIndex,

      rowIndex,

      faceIndex

    ) {


      const glyph =
        document.createElement(
          "span"
        );


      glyph.className =
        "glyph";



      /* ORANGE BACK CHARACTER */

      const trail =
        document.createElement(
          "span"
        );


      trail.className =
        "glyph-layer trail";



      /* WHITE FRONT CHARACTER */

      const front =
        document.createElement(
          "span"
        );


      front.className =
        "glyph-layer front";



      setCharacter(
        trail,
        character
      );


      setCharacter(
        front,
        character
      );


      /*
        Orange FIRST,
        white SECOND.

        White therefore completely
        covers orange when identical.
      */

      glyph.appendChild(
        trail
      );


      glyph.appendChild(
        front
      );


      glyphs.push({

        letterIndex,

        rowIndex,

        faceIndex,

        trail,

        front

      });


      return glyph;

    }



    /* ============================
       BUILD ROOM
    ============================ */

    function buildRoom() {


      surfaces.forEach(

        (
          surface,
          faceIndex
        ) => {


          /*
            EXACTLY FOUR WORDS
          */

          for (

            let rowIndex = 0;

            rowIndex < 4;

            rowIndex++

          ) {


            const row =
              document.createElement(
                "div"
              );


            row.className =
              "text-row";



            const token =
              document.createElement(
                "span"
              );


            token.className =
              "word-token";



            for (

              let letterIndex = 0;

              letterIndex < maxLetters;

              letterIndex++

            ) {


              const character =

                words[0][
                  letterIndex
                ]

                ||

                " ";



              token.appendChild(

                createGlyph(

                  character,

                  letterIndex,

                  rowIndex,

                  faceIndex

                )

              );

            }


            row.appendChild(
              token
            );


            surface.appendChild(
              row
            );

          }

        }

      );


      requestAnimationFrame(
        fitTypography
      );

    }



    /* ============================
       FIT WORD TO FACE
    ============================ */

    function fitTypography() {


      const rows =
        document.querySelectorAll(
          ".text-row"
        );


      rows.forEach(
        row => {


          const token =
            row.querySelector(
              ".word-token"
            );


          if (!token) return;



          token.style.transform =
            "scaleX(1)";



          const rowHeight =
            row.clientHeight;



          /*
            Larger vertically than
            previous version.
          */

          row.style.fontSize =

            (
              rowHeight
              *
              1.22
            )

            +
            "px";



          const naturalWidth =
            token.scrollWidth;


          /*
            Fill essentially the
            complete wall width.
          */

          const availableWidth =
            row.clientWidth
            *
            0.985;



          if (
            naturalWidth > 0
          ) {


            const scaleX =

              availableWidth

              /

              naturalWidth;



            token.style.transform =

              `scaleX(${scaleX})`;

          }

        }

      );

    }



    /* ============================
       WORD CHANGE
    ============================ */

    function changeWord(
      word
    ) {


      glyphs.forEach(
        item => {


          const character =

            word[
              item.letterIndex
            ]

            ||

            " ";



          /*
            Temporal displacement
            across characters,
            rows and surfaces.
          */

          const stagger =

            item.letterIndex
            * 42

            +

            item.rowIndex
            * 90

            +

            item.faceIndex
            * 28;



          /*
            WHITE CHARACTER CHANGES FIRST.

            Orange still contains the OLD
            character underneath it.

            Parts of that old orange letter
            become visible around the new
            white letter shape.
          */

          setTimeout(

            () => {

              setCharacter(
                item.front,
                character
              );

            },

            stagger

          );



          /*
            ORANGE CATCHES UP AFTERWARD.

            Once both characters match again,
            orange disappears completely
            behind white.
          */

          setTimeout(

            () => {

              setCharacter(
                item.trail,
                character
              );

            },

            stagger + 150

          );

        }

      );



      /*
        Refit typography after
        different length words.
      */

      setTimeout(

        () => {

          requestAnimationFrame(
            fitTypography
          );

        },

        650

      );

    }



    /* ============================
       INITIAL BUILD
    ============================ */

    buildRoom();



    window.addEventListener(

      "resize",

      () => {

        requestAnimationFrame(
          fitTypography
        );

      }

    );



    /* ============================
       AUTOMATIC WORD CHANGES
    ============================ */

    let wordIndex = 0;


    setInterval(

      () => {


        wordIndex =

          (
            wordIndex + 1
          )

          %

          words.length;



        changeWord(

          words[
            wordIndex
          ]

        );

      },

      2100

    );



    /* ============================
       CURSOR CAMERA

       DIRECT mapping.

       No easing/inertia.

       The front wall therefore
       follows cursor movement
       immediately.
    ============================ */

    function moveCamera(
      clientX,
      clientY
    ) {


      const rect =

        scene
          .getBoundingClientRect();



      /*
        Convert pointer to:

        -1 → left/top
         0 → center
        +1 → right/bottom
      */

      const x =

        (
          (
            clientX
            -
            rect.left
          )

          /

          rect.width

        )

        * 2

        - 1;



      const y =

        (
          (
            clientY
            -
            rect.top
          )

          /

          rect.height

        )

        * 2

        - 1;



      /*
        More exaggerated angles.

        Increase these later if you
        want an even more aggressive
        fisheye feeling.
      */

      const yaw =
        x * 19;


      const pitch =
        -y * 13;



      room.style.transform = `

        translate3d(
          -50%,
          -50%,
          100px
        )

        rotateX(
          ${pitch}deg
        )

        rotateY(
          ${yaw}deg
        )

      `;

    }



    scene.addEventListener(

      "pointermove",

      event => {

        moveCamera(

          event.clientX,

          event.clientY

        );

      }

    );



    /*
      Return to centre when cursor
      leaves the experiment.
    */

    scene.addEventListener(

      "pointerleave",

      () => {


        room.style.transition =
          "transform 500ms cubic-bezier(0.22, 1, 0.36, 1)";


        room.style.transform = `

          translate3d(
            -50%,
            -50%,
            100px
          )

          rotateX(0deg)

          rotateY(0deg)

        `;


        setTimeout(

          () => {

            room.style.transition =
              "none";

          },

          500

        );

      }

    );


  </script>


</body>

</html>
