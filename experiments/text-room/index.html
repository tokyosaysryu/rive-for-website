<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Interactive Text Room</title>


  <!-- BEBAS NEUE -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
    rel="stylesheet"
  >


  <style>

    :root {

      --bg: #0a0a0a;
      --fg: #f7f7f4;

      --trail-1: #00e5ff;
      --trail-2: #ff00bd;
      --trail-3: #b7ff00;

      /*
        Wider and deeper room
      */

      --room-w:
        clamp(900px, 125vw, 1600px);

      --room-h:
        clamp(600px, 82vw, 980px);

      --depth:
        clamp(650px, 85vw, 1000px);

    }



    * {
      box-sizing: border-box;
    }



    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: var(--bg);

    }



    body {

      font-family:
        "Bebas Neue",
        sans-serif;

    }



    /* ============================
       VIEWPORT
    ============================ */

    .scene {

      position: relative;

      width: 100vw;
      height: 100vh;

      min-height: 520px;

      overflow: hidden;


      /*
        Strong wide-angle perspective.
        Lower number = wider lens feel.
      */

      perspective: 420px;

      perspective-origin:
        50% 50%;


      background:
        var(--bg);


      cursor:
        crosshair;


      touch-action:
        pan-y;

    }



    /* ============================
       ROOM
    ============================ */

    .room {

      position: absolute;

      left: 50%;
      top: 50%;


      width:
        var(--room-w);

      height:
        var(--room-h);


      transform-style:
        preserve-3d;


      transform:

        translate3d(
          -50%,
          -50%,
          120px
        )

        rotateX(0deg)

        rotateY(0deg);


      will-change:
        transform;


      pointer-events:
        none;

    }



    /* ============================
       ALL WALLS
    ============================ */

    .face {

      position:
        absolute;


      overflow:
        hidden;


      background:
        var(--bg);


      color:
        var(--fg);


      transform-style:
        preserve-3d;


      backface-visibility:
        visible;

    }



    /* FRONT WALL */

    .back {

      inset: 0;


      transform:

        translateZ(
          calc(
            var(--depth) * -1
          )
        );

    }



    /* FLOOR */

    .floor {

      left: 0;
      top: 100%;


      width: 100%;

      height:
        var(--depth);


      transform-origin:
        0 0;


      transform:

        translateZ(
          calc(
            var(--depth) * -1
          )
        )

        rotateX(90deg);

    }



    /* CEILING */

    .ceiling {

      left: 0;
      bottom: 100%;


      width: 100%;

      height:
        var(--depth);


      transform-origin:
        0 100%;


      transform:

        translateZ(
          calc(
            var(--depth) * -1
          )
        )

        rotateX(-90deg);

    }



    /* LEFT WALL */

    .left {

      right: 100%;
      top: 0;


      width:
        var(--depth);

      height: 100%;


      transform-origin:
        100% 0;


      transform:

        translateZ(
          calc(
            var(--depth) * -1
          )
        )

        rotateY(90deg);

    }



    /* RIGHT WALL */

    .right {

      left: 100%;
      top: 0;


      width:
        var(--depth);

      height: 100%;


      transform-origin:
        0 0;


      transform:

        translateZ(
          calc(
            var(--depth) * -1
          )
        )

        rotateY(-90deg);

    }



    /* ============================
       TEXT SURFACE

       Exactly 4 words per face.
    ============================ */

    .surface {

      width: 100%;
      height: 100%;


      display: grid;


      grid-template-rows:
        repeat(
          4,
          1fr
        );


      overflow:
        hidden;


      background:
        var(--bg);

    }



    .text-row {

      width: 100%;
      height: 100%;


      display:
        flex;


      align-items:
        center;


      justify-content:
        center;


      overflow:
        visible;


      white-space:
        nowrap;


      font-family:
        "Bebas Neue",
        sans-serif;


      font-size:
        120px;


      font-weight:
        400;


      /*
        Very tight typography
      */

      line-height:
        0.78;


      letter-spacing:
        -0.035em;

    }



    .word-token {

      display:
        inline-flex;


      flex:
        0 0 auto;


      transform-origin:
        center center;


      white-space:
        nowrap;


      will-change:
        transform;

    }



    /* ============================
       INDIVIDUAL CHARACTER
    ============================ */

    .glyph {

      position:
        relative;


      display:
        grid;


      place-items:
        center;


      /*
        Tighter character spacing
      */

      width:
        0.47em;


      height:
        0.84em;

    }



    .glyph-layer {

      grid-area:
        1 / 1;


      display:
        block;


      line-height:
        0.78;


      font-family:
        "Bebas Neue",
        sans-serif;


      will-change:
        transform,
        opacity;


      transition:

        transform
        220ms
        ease,

        opacity
        220ms
        ease;

    }



    /* ============================
       COLOR TRAILS
    ============================ */

    .trail-3 {

      color:
        var(--trail-3);


      opacity:
        0.52;


      transform:

        translate(
          -0.15em,
          0.09em
        );

    }



    .trail-2 {

      color:
        var(--trail-2);


      opacity:
        0.64;


      transform:

        translate(
          -0.09em,
          0.055em
        );

    }



    .trail-1 {

      color:
        var(--trail-1);


      opacity:
        0.78;


      transform:

        translate(
          -0.04em,
          0.025em
        );

    }



    .front {

      position:
        relative;


      z-index:
        4;


      color:
        var(--fg);

    }



    /* ============================
       VIGNETTE
    ============================ */

    .vignette {

      position:
        absolute;


      inset:
        0;


      z-index:
        10;


      pointer-events:
        none;


      background:

        radial-gradient(

          circle
          at center,

          transparent
          32%,

          rgba(
            0,
            0,
            0,
            0.12
          )
          58%,

          rgba(
            0,
            0,
            0,
            0.62
          )
          100%

        );

    }



    /* ============================
       MOBILE
    ============================ */

    @media
      (max-width: 700px) {

      :root {

        --room-w:
          950px;

        --room-h:
          620px;

        --depth:
          720px;

      }


      .scene {

        min-height:
          480px;


        perspective:
          360px;

      }

    }



    @media
      (prefers-reduced-motion: reduce) {

      .glyph-layer {

        transition:
          none;

      }

    }

  </style>

</head>



<body>


  <main
    class="scene"
    id="scene"
  >


    <div
      class="room"
      id="room"
    >


      <!-- FRONT WALL -->

      <section
        class="face back"
      >

        <div
          class="surface"
          data-face="0"
        ></div>

      </section>



      <!-- FLOOR -->

      <section
        class="face floor"
      >

        <div
          class="surface"
          data-face="1"
        ></div>

      </section>



      <!-- CEILING -->

      <section
        class="face ceiling"
      >

        <div
          class="surface"
          data-face="2"
        ></div>

      </section>



      <!-- LEFT WALL -->

      <section
        class="face left"
      >

        <div
          class="surface"
          data-face="3"
        ></div>

      </section>



      <!-- RIGHT WALL -->

      <section
        class="face right"
      >

        <div
          class="surface"
          data-face="4"
        ></div>

      </section>


    </div>


    <div
      class="vignette"
    ></div>


  </main>



  <script>


    /* ============================
       WORDS
    ============================ */

    const words = [

      "CREATE",

      "MOTION",

      "DESIGN",

      "EXPLORE",

      "IMAGINE",

      "SYSTEMS"

    ];



    const scene =
      document.getElementById(
        "scene"
      );


    const room =
      document.getElementById(
        "room"
      );


    const surfaces =
      [
        ...document.querySelectorAll(
          ".surface"
        )
      ];



    const maxLetters =

      Math.max(

        ...words.map(
          word =>
            word.length
        )

      );



    const glyphs = [];



    /* ============================
       CHARACTER HELPER
    ============================ */

    function setCharacter(
      element,
      character
    ) {

      element.textContent =

        character ||

        "\u00A0";

    }



    /* ============================
       CREATE CHARACTER
    ============================ */

    function createGlyph(

      character,

      letterIndex,

      rowIndex,

      faceIndex

    ) {


      const glyph =
        document.createElement(
          "span"
        );


      glyph.className =
        "glyph";



      const trail3 =
        document.createElement(
          "span"
        );


      trail3.className =
        "glyph-layer trail-3";



      const trail2 =
        document.createElement(
          "span"
        );


      trail2.className =
        "glyph-layer trail-2";



      const trail1 =
        document.createElement(
          "span"
        );


      trail1.className =
        "glyph-layer trail-1";



      const front =
        document.createElement(
          "span"
        );


      front.className =
        "glyph-layer front";



      [

        trail3,

        trail2,

        trail1,

        front

      ].forEach(
        layer => {

          setCharacter(
            layer,
            character
          );


          glyph.appendChild(
            layer
          );

        }
      );



      glyphs.push({

        letterIndex,

        rowIndex,

        faceIndex,

        trail3,

        trail2,

        trail1,

        front

      });



      return glyph;

    }



    /* ============================
       BUILD ROOM

       4 ROWS
       1 WORD PER ROW
    ============================ */

    function buildRoom() {


      surfaces.forEach(

        (
          surface,
          faceIndex
        ) => {


          for (

            let rowIndex = 0;

            rowIndex < 4;

            rowIndex++

          ) {


            const row =
              document.createElement(
                "div"
              );


            row.className =
              "text-row";



            const token =
              document.createElement(
                "span"
              );


            token.className =
              "word-token";



            for (

              let letterIndex = 0;

              letterIndex < maxLetters;

              letterIndex++

            ) {


              const character =

                words[0][
                  letterIndex
                ]

                ||

                " ";



              token.appendChild(

                createGlyph(

                  character,

                  letterIndex,

                  rowIndex,

                  faceIndex

                )

              );

            }



            row.appendChild(
              token
            );


            surface.appendChild(
              row
            );

          }

        }

      );


      requestAnimationFrame(
        fitTypography
      );

    }



    /* ============================
       FIT WORD TO FACE WIDTH
    ============================ */

    function fitTypography() {


      const rows =
        document.querySelectorAll(
          ".text-row"
        );


      rows.forEach(
        row => {


          const token =
            row.querySelector(
              ".word-token"
            );


          if (!token) return;



          /*
            Reset before measuring
          */

          token.style.transform =
            "scaleX(1)";



          /*
            Size letters based on
            available row height.
          */

          const rowHeight =
            row.clientHeight;


          row.style.fontSize =
            (
              rowHeight
              *
              1.12
            )
            +
            "px";



          /*
            Stretch word until it fills
            around 94% of face width.
          */

          const naturalWidth =
            token.scrollWidth;


          const availableWidth =
            row.clientWidth
            *
            0.94;



          if (
            naturalWidth > 0
          ) {


            const scaleX =
              availableWidth
              /
              naturalWidth;


            token.style.transform =
              `scaleX(${scaleX})`;

          }

        }

      );

    }



    /* ============================
       CHANGE WORD
    ============================ */

    function changeWord(
      word
    ) {


      glyphs.forEach(
        item => {


          const character =

            word[
              item.letterIndex
            ]

            ||

            " ";



          /*
            Sequential displacement:

            character position
            +
            row position
            +
            room face position
          */

          const stagger =

            item.letterIndex
            * 50

            +

            item.rowIndex
            * 85

            +

            item.faceIndex
            * 32;



          /*
            MAIN WHITE CHARACTER
          */

          setTimeout(

            () =>
              setCharacter(
                item.front,
                character
              ),

            stagger

          );



          /*
            COLOURED TRAILS FOLLOW
          */

          setTimeout(

            () =>
              setCharacter(
                item.trail1,
                character
              ),

            stagger + 55

          );


          setTimeout(

            () =>
              setCharacter(
                item.trail2,
                character
              ),

            stagger + 110

          );


          setTimeout(

            () =>
              setCharacter(
                item.trail3,
                character
              ),

            stagger + 175

          );

        }

      );


      /*
        Recalculate scaling when words
        have different character counts.
      */

      setTimeout(

        () => {

          requestAnimationFrame(
            fitTypography
          );

        },

        600

      );

    }



    /* ============================
       BUILD INITIAL ROOM
    ============================ */

    buildRoom();



    /* ============================
       RESIZE
    ============================ */

    window.addEventListener(

      "resize",

      () => {

        requestAnimationFrame(
          fitTypography
        );

      }

    );



    /* ============================
       AUTOMATIC WORD CHANGE
    ============================ */

    let wordIndex = 0;



    if (

      !window
        .matchMedia(
          "(prefers-reduced-motion: reduce)"
        )
        .matches

    ) {


      setInterval(

        () => {


          wordIndex =

            (
              wordIndex + 1
            )

            %

            words.length;



          changeWord(

            words[
              wordIndex
            ]

          );

        },

        2100

      );

    }



    /* ============================
       MOUSE / POINTER CAMERA
    ============================ */

    let targetYaw = 0;

    let targetPitch = 0;


    let currentYaw = 0;

    let currentPitch = 0;



    function updatePointer(

      clientX,

      clientY

    ) {


      const rect =

        scene
          .getBoundingClientRect();



      const x =

        (
          (
            clientX
            -
            rect.left
          )

          /

          rect.width

        )

        * 2

        - 1;



      const y =

        (
          (
            clientY
            -
            rect.top
          )

          /

          rect.height

        )

        * 2

        - 1;



      /*
        Strong enough to feel interactive,
        but restrained enough to still feel
        like looking around a room.
      */

      targetYaw =
        x * 11;


      targetPitch =
        -y * 7;

    }



    scene.addEventListener(

      "pointermove",

      event => {

        updatePointer(

          event.clientX,

          event.clientY

        );

      }

    );



    scene.addEventListener(

      "pointerleave",

      () => {

        targetYaw = 0;

        targetPitch = 0;

      }

    );



    /* ============================
       SMOOTH CAMERA
    ============================ */

    function animateCamera() {


      currentYaw +=

        (
          targetYaw
          -
          currentYaw
        )

        *
        0.065;



      currentPitch +=

        (
          targetPitch
          -
          currentPitch
        )

        *
        0.065;



      room.style.transform = `

        translate3d(
          -50%,
          -50%,
          120px
        )

        rotateX(
          ${currentPitch}deg
        )

        rotateY(
          ${currentYaw}deg
        )

      `;



      requestAnimationFrame(
        animateCamera
      );

    }



    animateCamera();


  </script>


</body>

</html>
