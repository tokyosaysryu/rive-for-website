<!doctype html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Interactive Type Room</title>


<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
  rel="stylesheet"
>


<style>

:root {

  --black: #050505;
  --white: #f4f0e8;
  --orange: #ff4b00;

  --room-width: 1200px;
  --room-height: 780px;

  --depth: 900px;

}


/* =================================
   BASE
================================= */

* {
  box-sizing: border-box;
}


html,
body {

  width: 100%;
  height: 100%;

  margin: 0;

  overflow: hidden;

  background: var(--black);

}


body {

  font-family:
    "Bebas Neue",
    sans-serif;

}


/* =================================
   CAMERA / SCENE
================================= */

.scene {

  position: relative;

  width: 100vw;
  height: 100vh;

  overflow: hidden;

  background:
    var(--black);


  /*
    Very wide-angle lens feel.
  */

  perspective: 330px;

  perspective-origin:
    50% 50%;


  cursor: crosshair;

}


/* =================================
   ROOM
================================= */

.room {

  position: absolute;

  left: 50%;
  top: 50%;


  width:
    var(--room-width);

  height:
    var(--room-height);


  transform-style:
    preserve-3d;


  transform:

    translate3d(
      -50%,
      -50%,
      80px
    )

    rotateX(0deg)

    rotateY(0deg);


  will-change:
    transform;

}


/* =================================
   FACES
================================= */

.face {

  position: absolute;

  overflow: hidden;

  background:
    var(--black);

  transform-style:
    preserve-3d;

  backface-visibility:
    visible;

}


/* BACK / FRONT-FACING WALL */

.back {

  inset: 0;

  transform:

    translateZ(
      calc(
        var(--depth) * -1
      )
    );

}


/* FLOOR */

.floor {

  top: 100%;
  left: 0;

  width: 100%;

  height:
    var(--depth);


  transform-origin:
    0 0;


  transform:

    translateZ(
      calc(
        var(--depth) * -1
      )
    )

    rotateX(90deg);

}


/* CEILING */

.ceiling {

  bottom: 100%;
  left: 0;

  width: 100%;

  height:
    var(--depth);


  transform-origin:
    0 100%;


  transform:

    translateZ(
      calc(
        var(--depth) * -1
      )
    )

    rotateX(-90deg);

}


/* LEFT WALL */

.left {

  right: 100%;
  top: 0;

  width:
    var(--depth);

  height: 100%;


  transform-origin:
    100% 0;


  transform:

    translateZ(
      calc(
        var(--depth) * -1
      )
    )

    rotateY(90deg);

}


/* RIGHT WALL */

.right {

  left: 100%;
  top: 0;

  width:
    var(--depth);

  height: 100%;


  transform-origin:
    0 0;


  transform:

    translateZ(
      calc(
        var(--depth) * -1
      )
    )

    rotateY(-90deg);

}


/* =================================
   TEXT SURFACE
================================= */

.surface {

  width: 100%;
  height: 100%;

  display: grid;

  grid-template-rows:
    repeat(4, 1fr);

  background:
    var(--black);

  overflow: hidden;

}


/* =================================
   WORD ROW
================================= */

.text-row {

  position: relative;

  width: 100%;
  height: 100%;


  display: flex;

  justify-content: center;
  align-items: center;


  overflow: hidden;


  font-family:
    "Bebas Neue",
    sans-serif;


  font-size:
    180px;


  font-weight:
    400;


  line-height:
    0.72;


  letter-spacing:
    -0.075em;

}


/* =================================
   WORD
================================= */

.word {

  position: relative;

  display: inline-flex;

  transform-origin:
    center;


  /*
    Makes Bebas feel much wider
    and heavier.
  */

  transform:
    scaleX(1.15);


  white-space:
    nowrap;

}


/* =================================
   GLYPH
================================= */

.glyph {

  position: relative;

  display: grid;

  place-items: center;


  width:
    0.455em;


  height:
    0.8em;


  overflow:
    visible;

}


.glyph-layer {

  grid-area:
    1 / 1;


  font-family:
    "Bebas Neue",
    sans-serif;


  line-height:
    0.72;


  /*
    Fake heavier weight.
  */

  -webkit-text-stroke:
    2px currentColor;


  paint-order:
    stroke fill;


  will-change:
    transform,
    opacity,
    filter;

}


/* =================================
   ORANGE ECHO
================================= */

.echo {

  color:
    var(--orange);


  z-index:
    1;


  /*
    Normally perfectly hidden
    underneath white.
  */

  transform:
    translate3d(
      0,
      0,
      0
    );


  filter:
    blur(0px);

}


/* =================================
   WHITE LETTER
================================= */

.front {

  position: relative;

  z-index:
    2;


  color:
    var(--white);

}


/* =================================
   ACTIVE MOTION ECHO
================================= */

.glyph.motion .echo {

  /*
    Orange shoots out from behind
    the white glyph during transition.
  */

  transform:

    translate3d(
      -0.13em,
      0.025em,
      0
    )

    scaleX(1.12);


  filter:
    blur(2px);

}


/* =================================
   EDGE DARKENING
================================= */

.vignette {

  position: absolute;

  inset: 0;

  z-index: 20;

  pointer-events: none;


  background:

    radial-gradient(

      ellipse
      at center,

      transparent
      34%,

      rgba(
        0,
        0,
        0,
        0.08
      )
      58%,

      rgba(
        0,
        0,
        0,
        0.52
      )
      100%

    );

}


/* =================================
   MOBILE
================================= */

@media
(max-width: 700px) {

  :root {

    --room-width:
      950px;

    --room-height:
      650px;

    --depth:
      780px;

  }


  .scene {

    perspective:
      280px;

  }

}

</style>

</head>



<body>


<main
  class="scene"
  id="scene"
>


  <div
    class="room"
    id="room"
  >


    <!-- FRONT WALL -->

    <section
      class="face back"
    >

      <div
        class="surface"
      ></div>

    </section>



    <!-- FLOOR -->

    <section
      class="face floor"
    >

      <div
        class="surface"
      ></div>

    </section>



    <!-- CEILING -->

    <section
      class="face ceiling"
    >

      <div
        class="surface"
      ></div>

    </section>



    <!-- LEFT -->

    <section
      class="face left"
    >

      <div
        class="surface"
      ></div>

    </section>



    <!-- RIGHT -->

    <section
      class="face right"
    >

      <div
        class="surface"
      ></div>

    </section>


  </div>


  <div
    class="vignette"
  ></div>


</main>



<script>


/* =================================
   WORD LIST
================================= */

const words = [

  "CREATE",

  "MOTION",

  "DESIGN",

  "EXPLORE",

  "REEL",

  "SHOW"

];


const scene =
  document.getElementById(
    "scene"
  );


const room =
  document.getElementById(
    "room"
  );


const surfaces = [

  ...document.querySelectorAll(
    ".surface"
  )

];


const maxLetters =

  Math.max(

    ...words.map(
      word =>
        word.length
    )

  );


const glyphs = [];



/* =================================
   CHARACTER SETTER
================================= */

function setCharacter(

  element,

  character

) {

  element.textContent =

    character ||

    "\u00A0";

}



/* =================================
   CREATE GLYPH
================================= */

function createGlyph(

  char,

  letterIndex,

  rowIndex,

  faceIndex

) {


  const glyph =
    document.createElement(
      "span"
    );


  glyph.className =
    "glyph";


  const echo =
    document.createElement(
      "span"
    );


  echo.className =
    "glyph-layer echo";


  const front =
    document.createElement(
      "span"
    );


  front.className =
    "glyph-layer front";


  setCharacter(
    echo,
    char
  );


  setCharacter(
    front,
    char
  );


  glyph.appendChild(
    echo
  );


  glyph.appendChild(
    front
  );


  glyphs.push({

    glyph,

    echo,

    front,

    letterIndex,

    rowIndex,

    faceIndex

  });


  return glyph;

}



/* =================================
   BUILD FACE TEXT
================================= */

function buildRoom() {


  surfaces.forEach(

    (
      surface,
      faceIndex
    ) => {


      /*
        FOUR LARGE WORDS
      */

      for (

        let rowIndex = 0;

        rowIndex < 4;

        rowIndex++

      ) {


        const row =
          document.createElement(
            "div"
          );


        row.className =
          "text-row";


        const word =
          document.createElement(
            "div"
          );


        word.className =
          "word";


        for (

          let i = 0;

          i < maxLetters;

          i++

        ) {


          const char =

            words[0][i]

            ||

            " ";


          word.appendChild(

            createGlyph(

              char,

              i,

              rowIndex,

              faceIndex

            )

          );

        }


        row.appendChild(
          word
        );


        surface.appendChild(
          row
        );

      }

    }

  );


  requestAnimationFrame(
    fitWords
  );

}



/* =================================
   FIT WORDS TO ENTIRE FACE
================================= */

function fitWords() {


  document
    .querySelectorAll(
      ".text-row"
    )
    .forEach(
      row => {


        const word =
          row.querySelector(
            ".word"
          );


        if (!word) return;


        word.style.transform =
          "scaleX(1)";


        const rowHeight =
          row.clientHeight;


        /*
          Very tall typography.
        */

        row.style.fontSize =

          (
            rowHeight
            *
            1.32
          )

          +
          "px";


        const naturalWidth =
          word.scrollWidth;


        const availableWidth =
          row.clientWidth
          *
          1.04;


        if (
          naturalWidth > 0
        ) {


          const scaleX =

            availableWidth

            /

            naturalWidth;


          word.style.transform =

            `scaleX(${scaleX})`;

        }

      }

    );

}



/* =================================
   WORD CHANGE
================================= */

function changeWord(
  word
) {


  glyphs.forEach(
    item => {


      const nextChar =

        word[
          item.letterIndex
        ]

        ||

        " ";


      /*
        Propagation across the room.

        Top-left characters change
        before bottom-right characters.
      */

      const stagger =

        item.letterIndex
        *
        34

        +

        item.rowIndex
        *
        75

        +

        item.faceIndex
        *
        28;


      /*
        START ORANGE MOTION SMEAR
      */

      setTimeout(

        () => {

          item.glyph
            .classList
            .add(
              "motion"
            );


          /*
            White becomes new letter.

            Orange still holds old letter.
          */

          setCharacter(

            item.front,

            nextChar

          );

        },

        stagger

      );


      /*
        ORANGE CATCHES UP
      */

      setTimeout(

        () => {


          setCharacter(

            item.echo,

            nextChar

          );


          item.glyph
            .classList
            .remove(
              "motion"
            );


        },

        stagger
        +
        150

      );

    }

  );


  /*
    Refit when switching
    between REEL / EXPLORE etc.
  */

  setTimeout(

    () => {

      requestAnimationFrame(
        fitWords
      );

    },

    650

  );

}



/* =================================
   INITIAL BUILD
================================= */

buildRoom();



window.addEventListener(

  "resize",

  () => {

    requestAnimationFrame(
      fitWords
    );

  }

);



/* =================================
   AUTOMATIC WORD CYCLE
================================= */

let wordIndex = 0;


setInterval(

  () => {


    wordIndex =

      (
        wordIndex
        +
        1
      )

      %

      words.length;


    changeWord(

      words[
        wordIndex
      ]

    );

  },

  1800

);



/* =================================
   CAMERA
================================= */

let targetX = 0;
let targetY = 0;


let currentX = 0;
let currentY = 0;


/*
  Vanishing point
*/

let targetOriginX = 50;
let targetOriginY = 50;


let currentOriginX = 50;
let currentOriginY = 50;



scene.addEventListener(

  "pointermove",

  event => {


    const rect =
      scene
        .getBoundingClientRect();


    /*
      -1 → +1
    */

    const x =

      (
        (
          event.clientX
          -
          rect.left
        )

        /

        rect.width

      )

      *
      2

      -
      1;


    const y =

      (
        (
          event.clientY
          -
          rect.top
        )

        /

        rect.height

      )

      *
      2

      -
      1;



    /*
      CAMERA ROTATION

      Exaggerated like the reference.
    */

    targetX =
      x * 27;


    targetY =
      -y * 21;



    /*
      VANISHING POINT

      This is the major difference.

      Perspective now physically follows
      the cursor across the viewport.
    */

    targetOriginX =

      50

      +

      x * 30;


    targetOriginY =

      50

      +

      y * 30;

  }

);



scene.addEventListener(

  "pointerleave",

  () => {


    targetX = 0;

    targetY = 0;


    targetOriginX = 50;

    targetOriginY = 50;

  }

);



/* =================================
   CAMERA LOOP
================================= */

function animateCamera() {


  /*
    Small amount of easing.

    Still responsive but not jittery.
  */

  currentX +=

    (
      targetX
      -
      currentX
    )

    *
    0.11;


  currentY +=

    (
      targetY
      -
      currentY
    )

    *
    0.11;



  currentOriginX +=

    (
      targetOriginX
      -
      currentOriginX
    )

    *
    0.13;


  currentOriginY +=

    (
      targetOriginY
      -
      currentOriginY
    )

    *
    0.13;



  /*
    MOVE PERSPECTIVE ORIGIN
  */

  scene.style.perspectiveOrigin =

    `${currentOriginX}% ${currentOriginY}%`;



  /*
    ROTATE ROOM
  */

  room.style.transform = `

    translate3d(
      -50%,
      -50%,
      80px
    )

    rotateX(
      ${currentY}deg
    )

    rotateY(
      ${currentX}deg
    )

  `;



  requestAnimationFrame(
    animateCamera
  );

}


animateCamera();


</script>


</body>

</html>
