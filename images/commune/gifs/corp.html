<!doctype html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Corporate Structure</title>

<link
  href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap"
  rel="stylesheet"
>


<style>

* {
  box-sizing: border-box;
}


html,
body {
  margin: 0;
  width: 100%;
  background: transparent;

  font-family:
    "Montserrat",
    sans-serif;
}


.structure-block {
  width: 100%;
}


/* =========================
   MAIN CONTAINER
========================= */

.structure-container {

  position: relative;

  width: 100%;
  height: 620px;

  overflow: hidden;

  border:
    1px solid #dddddd;

  border-radius:
    16px;

  background:
    #ffffff;
}


/* =========================
   INTERNAL CHART
========================= */

.org-chart {

  position: absolute;

  left: 50%;
  top: 50%;

  width: 1200px;
  height: 600px;

  transform:

    translate(
      -50%,
      -50%
    );

}


/* =========================
   CONNECTIONS
========================= */

.connections {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  pointer-events: none;

}


.connection {

  fill: none;

  stroke:
    #d0d0d0;

  stroke-width:
    1.5;

  stroke-linecap:
    round;

  stroke-linejoin:
    round;

  stroke-dasharray:
    1600;

  stroke-dashoffset:
    1600;

}


/* =========================
   CARDS
========================= */

.node {

  position: absolute;

  width: 160px;
  height: 76px;

  display: flex;

  flex-direction:
    column;

  justify-content:
    center;

  align-items:
    center;


  padding:
    12px;


  border:
    1px solid #dddddd;

  border-radius:
    14px;


  background:
    #ffffff;


  text-align:
    center;


  opacity: 0;


  transform:

    translateY(12px)

    scale(0.96);

}


.node-label {

  margin-bottom:
    6px;


  color:
    #999999;


  font-size:
    10px;

  font-weight:
    500;

  line-height:
    1;


  letter-spacing:
    0.06em;


  text-transform:
    uppercase;

}


.node-name {

  color:
    #111111;


  font-size:
    15px;

  font-weight:
    600;

  line-height:
    1.2;

}


/* =========================
   CEO
========================= */

.ceo {

  left: 505px;
  top: 25px;

  width: 190px;
  height: 86px;


  background:
    #111111;

  border-color:
    #111111;

}


.ceo .node-name {

  color:
    #ffffff;

}


.ceo .node-label {

  color:
    rgba(
      255,
      255,
      255,
      0.55
    );

}


/* =========================
   C-SUITE
========================= */

.exec-1 {
  left: 20px;
  top: 205px;
}


.exec-2 {
  left: 220px;
  top: 205px;
}


.exec-3 {
  left: 420px;
  top: 205px;
}


.exec-4 {
  left: 620px;
  top: 205px;
}


.exec-5 {
  left: 820px;
  top: 205px;
}


.exec-6 {
  left: 1020px;
  top: 205px;
}


/* =========================
   DEPARTMENTS
========================= */

.department {

  width:
    170px;

  height:
    78px;

}


.dept-1 {
  left: 15px;
  top: 485px;
}


.dept-2 {
  left: 215px;
  top: 485px;
}


.dept-3 {
  left: 415px;
  top: 485px;
}


.dept-4 {
  left: 615px;
  top: 485px;
}


.dept-5 {
  left: 815px;
  top: 485px;
}


.dept-6 {
  left: 1015px;
  top: 485px;
}


/* =========================
   REVEAL ANIMATION
========================= */

.org-chart.play .ceo {

  animation:

    revealNode
    0.55s
    cubic-bezier(
      0.22,
      1,
      0.36,
      1
    )

    0.2s

    forwards;

}


.org-chart.play
.line-top {

  animation:

    drawLine
    0.8s
    ease

    0.65s

    forwards;

}


.org-chart.play .exec-1 {

  animation:
    revealNode
    0.45s
    ease
    1.1s
    forwards;

}


.org-chart.play .exec-2 {

  animation:
    revealNode
    0.45s
    ease
    1.2s
    forwards;

}


.org-chart.play .exec-3 {

  animation:
    revealNode
    0.45s
    ease
    1.3s
    forwards;

}


.org-chart.play .exec-4 {

  animation:
    revealNode
    0.45s
    ease
    1.4s
    forwards;

}


.org-chart.play .exec-5 {

  animation:
    revealNode
    0.45s
    ease
    1.5s
    forwards;

}


.org-chart.play .exec-6 {

  animation:
    revealNode
    0.45s
    ease
    1.6s
    forwards;

}


.org-chart.play
.line-bottom {

  animation:

    drawLine
    1s
    ease

    1.9s

    forwards;

}


.org-chart.play .dept-1 {

  animation:
    revealNode
    0.45s
    ease
    2.5s
    forwards;

}


.org-chart.play .dept-2 {

  animation:
    revealNode
    0.45s
    ease
    2.6s
    forwards;

}


.org-chart.play .dept-3 {

  animation:
    revealNode
    0.45s
    ease
    2.7s
    forwards;

}


.org-chart.play .dept-4 {

  animation:
    revealNode
    0.45s
    ease
    2.8s
    forwards;

}


.org-chart.play .dept-5 {

  animation:
    revealNode
    0.45s
    ease
    2.9s
    forwards;

}


.org-chart.play .dept-6 {

  animation:
    revealNode
    0.45s
    ease
    3s
    forwards;

}


@keyframes revealNode {

  from {

    opacity: 0;

    transform:

      translateY(12px)

      scale(0.96);

  }


  to {

    opacity: 1;

    transform:

      translateY(0)

      scale(1);

  }

}


@keyframes drawLine {

  from {

    stroke-dashoffset:
      1600;

  }


  to {

    stroke-dashoffset:
      0;

  }

}


/* =========================
   TITLE BELOW
========================= */

.structure-title-row {

  display: flex;

  justify-content:
    flex-end;


  width: 100%;


  margin-top:
    16px;

}


.structure-title {

  display: inline-flex;


  align-items:
    center;

  justify-content:
    center;


  padding:
    8px 14px;


  border-radius:
    999px;


  background:
    #f2f2f2;


  color:
    #111111;


  font-family:
    "Montserrat",
    sans-serif;


  font-size:
    12px;


  font-weight:
    300;


  line-height:
    1;


  letter-spacing:
    0.03em;

}


/* =========================
   RESPONSIVE
========================= */

@media
(max-width: 1100px) {

  .structure-container {

    height:
      540px;

  }


  .org-chart {

    transform:

      translate(
        -50%,
        -50%
      )

      scale(0.82);

  }

}


@media
(max-width: 800px) {

  .structure-container {

    height:
      450px;

  }


  .org-chart {

    transform:

      translate(
        -50%,
        -50%
      )

      scale(0.62);

  }

}


@media
(max-width: 550px) {

  .structure-container {

    height:
      360px;

  }


  .org-chart {

    transform:

      translate(
        -50%,
        -50%
      )

      scale(0.46);

  }


  .structure-title {

    font-size:
      10px;


    padding:
      7px 12px;

  }

}

</style>

</head>


<body>


<div class="structure-block">


  <!-- ANIMATION CONTAINER -->

  <div class="structure-container">


    <div
      class="org-chart"
      id="orgChart"
    >


      <!-- CONNECTIONS -->

      <svg
        class="connections"
        viewBox="0 0 1200 600"
      >


        <!-- CEO TO EXECUTIVES -->

        <path
          class="
            connection
            line-top
          "
          d="

            M 600 111

            L 600 160


            M 100 160
            L 1100 160


            M 100 160
            L 100 205


            M 300 160
            L 300 205


            M 500 160
            L 500 205


            M 700 160
            L 700 205


            M 900 160
            L 900 205


            M 1100 160
            L 1100 205

          "
        />


        <!-- EXECUTIVES TO DEPARTMENTS -->

        <path
          class="
            connection
            line-bottom
          "
          d="

            M 100 281
            L 100 380


            M 300 281
            L 300 380


            M 500 281
            L 500 380


            M 700 281
            L 700 380


            M 900 281
            L 900 380


            M 1100 281
            L 1100 380


            M 100 380
            L 1100 380


            M 100 380
            L 100 485


            M 300 380
            L 300 485


            M 500 380
            L 500 485


            M 700 380
            L 700 485


            M 900 380
            L 900 485


            M 1100 380
            L 1100 485

          "
        />


      </svg>



      <!-- CEO -->

      <div class="node ceo">

        <div class="node-label">
          Executive
        </div>

        <div class="node-name">
          CEO
        </div>

      </div>



      <!-- C-SUITE -->

      <div class="node exec-1">

        <div class="node-label">
          Technology
        </div>

        <div class="node-name">
          CTO
        </div>

      </div>


      <div class="node exec-2">

        <div class="node-label">
          Finance
        </div>

        <div class="node-name">
          CFO
        </div>

      </div>


      <div class="node exec-3">

        <div class="node-label">
          Marketing
        </div>

        <div class="node-name">
          CMO
        </div>

      </div>


      <div class="node exec-4">

        <div class="node-label">
          Design
        </div>

        <div class="node-name">
          CDO
        </div>

      </div>


      <div class="node exec-5">

        <div class="node-label">
          Product
        </div>

        <div class="node-name">
          CPO
        </div>

      </div>


      <div class="node exec-6">

        <div class="node-label">
          Operations
        </div>

        <div class="node-name">
          COO
        </div>

      </div>



      <!-- DEPARTMENTS -->

      <div
        class="
          node
          department
          dept-1
        "
      >

        <div class="node-label">
          Department
        </div>

        <div class="node-name">
          Marketing
        </div>

      </div>


      <div
        class="
          node
          department
          dept-2
        "
      >

        <div class="node-label">
          Department
        </div>

        <div class="node-name">
          Product
        </div>

      </div>


      <div
        class="
          node
          department
          dept-3
        "
      >

        <div class="node-label">
          Department
        </div>

        <div class="node-name">
          Design
        </div>

      </div>


      <div
        class="
          node
          department
          dept-4
        "
      >

        <div class="node-label">
          Department
        </div>

        <div class="node-name">
          Sales
        </div>

      </div>


      <div
        class="
          node
          department
          dept-5
        "
      >

        <div class="node-label">
          Department
        </div>

        <div class="node-name">
          Corporate & PR
        </div>

      </div>


      <div
        class="
          node
          department
          dept-6
        "
      >

        <div class="node-label">
          Department
        </div>

        <div class="node-name">
          Internal & HR
        </div>

      </div>


    </div>


  </div>



  <!-- TITLE -->

  <div class="structure-title-row">

    <div class="structure-title">

      ORGANIZATIONAL STRUCTURE

    </div>

  </div>


</div>



<script>


const chart =
  document.getElementById(
    "orgChart"
  );


function playAnimation() {


  chart.classList.remove(
    "play"
  );


  /*
    Force animation reset
  */

  void chart.offsetWidth;


  chart.classList.add(
    "play"
  );

}


/*
  INITIAL
*/

playAnimation();


/*
  LOOP
*/

setInterval(

  playAnimation,

  7000

);


</script>


</body>

</html>
